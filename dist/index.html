<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#ffd100" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OveNotesDS - Emparejamiento</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo_pwa.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0d13; --panel:#0f1118; --accent:#ffd100; --muted:#8e9297; --text:#ffffff;
    }
    @font-face {
      font-family: 'NDS BIOS';
      src: url('https://files.catbox.moe/ipi8ww.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:'NDS BIOS', Outfit, system-ui, 'Segoe UI', Arial, sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; min-height:100vh; margin:0; display:block;
      /* Dark background with subtle dot-grid similar to original */
      background-color: var(--bg);
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 16px 16px;
      background-repeat: repeat;
    }

    .wrap{max-width:1100px;margin:18px auto;padding:16px;background:rgba(255,255,255,0.02);border-radius:8px}
    .header{font-weight:800;color:var(--accent);padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.03)}
    .main{padding:18px;display:flex;flex-direction:column;gap:12px}
    .pairing-title{text-align:center;color:var(--accent);font-weight:800;letter-spacing:1px;font-family:'NDS BIOS', Outfit, sans-serif}
    .pairing-code{display:block;margin:6px auto;font-size:44px;font-weight:900;letter-spacing:10px;background:rgba(255,255,255,0.02);padding:12px 22px;border-radius:8px;border:1px dashed rgba(255,209,0,0.45);max-width:420px;text-align:center;font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace}
    .meta{text-align:center;color:var(--muted);font-size:13px}

    .notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:6px}
    .note-card{background:var(--panel);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
    .note-thumb{width:100%;height:140px;object-fit:contain;border-radius:6px;background:#000}
    .note-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:8px}
    .empty{padding:28px;text-align:center;color:var(--muted)}

    .note-actions{display:flex;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap}
    .btn-download{background:var(--accent);color:#000;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:800;font-size:12px;border:none;cursor:pointer}
    .btn-download:hover{filter:brightness(0.95)}
    .btn-view{background:#00bcd4;color:#000;padding:6px 10px;border-radius:6px;border:none;font-weight:800;font-size:12px;cursor:pointer}
    .btn-view:hover{filter:brightness(0.95)}
    .btn-delete{background:transparent;color:#ff4d4d;border:1px solid rgba(255,77,77,0.12);padding:6px 10px;border-radius:6px;font-weight:800;cursor:pointer}
    .btn-delete:hover{background:rgba(255,77,77,0.04)}

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 13, 19, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      max-width: 95%;
      max-height: 95%;
      width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .modal-image {
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }
    .modal-title {
      font-weight: 800;
      color: var(--accent);
      font-size: 14px;
      text-align: center;
    }
    .modal-tip {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: -4px;
    }
    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }
    .btn-close {
      background: #fff;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-close:hover {
      filter: brightness(0.9);
    }

    .btn-restart {
      background: transparent;
      color: #ffd100;
      border: 1px solid rgba(255, 209, 0, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      font-family: 'NDS BIOS', Outfit, sans-serif;
    }
    .btn-restart:hover {
      background: rgba(255, 209, 0, 0.1);
      border-color: #ffd100;
    }
    .btn-restart:active {
      transform: scale(0.95);
    }

    @media (max-width:720px){.wrap{margin:8px;padding:12px}.pairing-code{font-size:28px;letter-spacing:6px}.note-thumb{height:100px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header" style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:'NDS BIOS', Outfit, sans-serif; font-size:16px;">OveNotesDS</span>
      <div class="lang-switch" style="display:flex; gap:8px;">
        <button id="btnLangEs" onclick="setLang('es')" style="background:var(--accent); color:#000; border:none; padding:4px 8px; border-radius:4px; font-weight:800; font-size:11px; cursor:pointer; font-family:'NDS BIOS', sans-serif;">ES</button>
        <button id="btnLangEn" onclick="setLang('en')" style="background:rgba(255,255,255,0.08); color:var(--text); border:none; padding:4px 8px; border-radius:4px; font-weight:800; font-size:11px; cursor:pointer; font-family:'NDS BIOS', sans-serif;">EN</button>
        <button id="btnLangFr" onclick="setLang('fr')" style="background:rgba(255,255,255,0.08); color:var(--text); border:none; padding:4px 8px; border-radius:4px; font-weight:800; font-size:11px; cursor:pointer; font-family:'NDS BIOS', sans-serif;">FR</button>
      </div>
    </div>
    <div class="main">
      <div>
        <div class="pairing-title">CÓDIGO DE CONEXIÓN</div>
        <div id="pairingCode" class="pairing-code">------</div>
        <div id="pairingMeta" class="meta">IP: ... &nbsp;&nbsp; PORT: ...</div>
        <div style="text-align: center;">
          <button class="btn-restart" onclick="restartServer()">Reiniciar Servidor</button>
        </div>
      </div>

      <div>
        <div id="notesContainer" class="notes-grid"></div>
      </div>
    </div>
  </div>
  <div id="noteModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div id="modalTitle" class="modal-title"></div>
      <img id="modalImage" class="modal-image" src="" alt="Preview" />
      <div class="modal-tip">Tip: Mantén pulsada la imagen para guardarla en la galería del móvil</div>
      <div class="modal-actions">
        <button id="modalDownload" class="btn-download">Descargar</button>
        <button class="btn-close" onclick="closeModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // Server can replace these tokens or set window.initialPairing / window.initialNotes
    let pairingCodeData = { code: '------', ip: '...', port: '...' };
    let cachedNotes = [];

    const translations = {
      es: {
        title: "OveNotesDS - Emparejamiento",
        pairingTitle: "CÓDIGO DE CONEXIÓN",
        restartBtn: "Reiniciar Servidor",
        emptyNotes: "No se encontraron notas. Envía una nota desde tu DSi.",
        btnView: "Ver",
        btnDownload: "Descargar",
        btnDelete: "Eliminar",
        modalTip: "Tip: Mantén pulsada la imagen para guardarla en la galería del móvil",
        btnClose: "Cerrar",
        restartConfirm: "¿Seguro que quieres reiniciar el servidor?",
        restarting: "Reiniciando...",
        restartAlert: "El servidor se está reiniciando. Por favor, espera unos segundos y recarga la página.",
        restartError: "Error al reiniciar el servidor.",
        connectError: "Error al conectar con el servidor.",
        deleteConfirm: "¿Eliminar esta nota? Esta acción no se puede deshacer.",
        deleteError: "No se pudo eliminar la nota.",
        deleteCatch: "Error al eliminar"
      },
      en: {
        title: "OveNotesDS - Pairing",
        pairingTitle: "CONNECTION CODE",
        restartBtn: "Restart Server",
        emptyNotes: "No notes found. Send a note from your DSi.",
        btnView: "View",
        btnDownload: "Download",
        btnDelete: "Delete",
        modalTip: "Tip: Long press the image to save it to your mobile gallery",
        btnClose: "Close",
        restartConfirm: "Are you sure you want to restart the server?",
        restarting: "Restarting...",
        restartAlert: "The server is restarting. Please wait a few seconds and reload the page.",
        restartError: "Error restarting the server.",
        connectError: "Error connecting to the server.",
        deleteConfirm: "Delete this note? This action cannot be undone.",
        deleteError: "Could not delete the note.",
        deleteCatch: "Error deleting"
      },
      fr: {
        title: "OveNotesDS - Appairage",
        pairingTitle: "CODE DE CONNEXION",
        restartBtn: "Redemarrer Serveur",
        emptyNotes: "Aucune note trouvee. Envoyez une note depuis votre DSi.",
        btnView: "Voir",
        btnDownload: "Telecharger",
        btnDelete: "Supprimer",
        modalTip: "Tip: Maintenez l'image enfoncee pour l'enregistrer dans la galerie mobile",
        btnClose: "Fermer",
        restartConfirm: "Voulez-vous vraiment redemarrer le serveur ?",
        restarting: "Redemarrage...",
        restartAlert: "Le serveur redemarre. Veuillez patienter quelques secondes et recharger la page.",
        restartError: "Erreur lors du redemarrage du serveur.",
        connectError: "Erreur de connexion au serveur.",
        deleteConfirm: "Supprimer cette note ? Cette action est irreversible.",
        deleteError: "Impossible de supprimer la note.",
        deleteCatch: "Erreur de suppression"
      }
    };

    let currentLang = localStorage.getItem('lang') || (navigator.language && navigator.language.startsWith('es') ? 'es' : (navigator.language && navigator.language.startsWith('fr') ? 'fr' : 'en'));

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      
      const btnEs = document.getElementById('btnLangEs');
      const btnEn = document.getElementById('btnLangEn');
      const btnFr = document.getElementById('btnLangFr');
      
      btnEs.style.background = (lang === 'es') ? 'var(--accent)' : 'rgba(255,255,255,0.08)';
      btnEs.style.color = (lang === 'es') ? '#000' : 'var(--text)';
      
      btnEn.style.background = (lang === 'en') ? 'var(--accent)' : 'rgba(255,255,255,0.08)';
      btnEn.style.color = (lang === 'en') ? '#000' : 'var(--text)';
      
      btnFr.style.background = (lang === 'fr') ? 'var(--accent)' : 'rgba(255,255,255,0.08)';
      btnFr.style.color = (lang === 'fr') ? '#000' : 'var(--text)';
      
      document.title = translations[lang].title;
      document.querySelector('.pairing-title').textContent = translations[lang].pairingTitle;
      document.querySelector('.btn-restart').textContent = translations[lang].restartBtn;
      document.querySelector('.modal-tip').textContent = translations[lang].modalTip;
      document.getElementById('modalDownload').textContent = translations[lang].btnDownload;
      document.querySelector('.btn-close').textContent = translations[lang].btnClose;
      
      render();
    }

    function getApiUrl(path) {
      if (window.__TAURI_INTERNALS__ || window.__tauri_ipc__) {
        return 'http://127.0.0.1:3000' + path;
      }
      return path;
    }

    function formatTime(ts){ try{ return new Date(ts).toLocaleString() }catch(e){return ''} }

    function render(){
      const codeEl = document.getElementById('pairingCode');
      const metaEl = document.getElementById('pairingMeta');
      const notesEl = document.getElementById('notesContainer');

      codeEl.textContent = pairingCodeData.code || '----';
      metaEl.textContent = `IP: ${pairingCodeData.ip||'...'}   PORT: ${pairingCodeData.port||'...'}`;

      if(!Array.isArray(cachedNotes) || cachedNotes.length===0){
        notesEl.innerHTML = `<div class="empty">${translations[currentLang].emptyNotes}</div>`;
        return;
      }

      notesEl.innerHTML = cachedNotes.map(n=>{
        const time = n.time ? formatTime(n.time) : '';
        const url = getApiUrl('/notas/' + encodeURIComponent(n.name));
        return `\
          <div class="note-card">\
            <img class="note-thumb" src="${url}" alt="${n.name}" onclick="openNote('${encodeURIComponent(n.name)}')" style="cursor:pointer" />\
            <div class="note-meta"><span>${time}</span><span>${n.name}</span></div>\
            <div class="note-actions">\
              <button class="btn-view" onclick="openNote('${encodeURIComponent(n.name)}')">${translations[currentLang].btnView}</button>\
              <button class="btn-download" onclick="downloadNote('${url}', '${n.name}')">${translations[currentLang].btnDownload}</button>\
              <button class="btn-delete" onclick="deleteNote('${encodeURIComponent(n.name)}', event)">${translations[currentLang].btnDelete}</button>\
            </div>\
          </div>`;
      }).join('');
    }

    function openNote(name){
      let decoded = name;
      try{ decoded = decodeURIComponent(name); }catch(e){}
      const url = getApiUrl('/notas/' + encodeURIComponent(decoded));
      
      document.getElementById('modalTitle').textContent = decoded;
      const img = document.getElementById('modalImage');
      img.src = url;
      
      const downloadBtn = document.getElementById('modalDownload');
      downloadBtn.onclick = () => downloadNote(url, decoded);
      
      document.getElementById('noteModal').classList.add('show');
    }

    function closeModal(){
      document.getElementById('noteModal').classList.remove('show');
    }

    async function downloadNote(url, filename){
      if (window.__TAURI__ && window.__TAURI__.core && typeof window.__TAURI__.core.invoke === 'function') {
        try {
          await window.__TAURI__.core.invoke('save_note_file', { filename: filename });
        } catch (e) {
          console.error("Tauri download failed", e);
        }
        return;
      }
      try {
        const downloadUrl = url + (url.includes('?') ? '&' : '?') + 'download=1';
        const res = await fetch(downloadUrl);
        if (!res.ok) throw new Error("Fetch failed");
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        console.error("Blob download failed, trying standard fallback", err);
        const downloadUrl = url + (url.includes('?') ? '&' : '?') + 'download=1';
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    async function restartServer() {
      const ok = confirm(translations[currentLang].restartConfirm);
      if (!ok) return;
      try {
        const btn = document.querySelector('.btn-restart');
        const oldText = btn.textContent;
        btn.textContent = translations[currentLang].restarting;
        btn.disabled = true;
        
        const r = await fetch(getApiUrl('/api/restart'), { method: 'POST' });
        if (r.ok) {
          alert(translations[currentLang].restartAlert);
          setTimeout(() => {
            window.location.reload();
          }, 3000);
        } else {
          alert(translations[currentLang].restartError);
          btn.textContent = oldText;
          btn.disabled = false;
        }
      } catch (e) {
        console.error('restart failed', e);
        alert(translations[currentLang].connectError);
        const btn = document.querySelector('.btn-restart');
        if (btn) {
          btn.textContent = translations[currentLang].restartBtn;
          btn.disabled = false;
        }
      }
    }

    async function deleteNote(name, event){
      if(event && event.stopPropagation) event.stopPropagation();
      let decoded = name;
      try{ decoded = decodeURIComponent(name); }catch(e){}
      const ok = confirm(translations[currentLang].deleteConfirm);
      if(!ok) return;
      try{
        const r = await fetch(getApiUrl('/api/notas/' + encodeURIComponent(decoded)), { method: 'DELETE' });
        if(r.ok){
          // remove from cachedNotes and re-render
          cachedNotes = cachedNotes.filter(n => n.name !== decoded && n.name !== name);
          render();
        } else {
          alert(translations[currentLang].deleteError);
        }
      }catch(e){ console.error('delete failed', e); alert(translations[currentLang].deleteCatch); }
    }

    async function fetchNotes(){
      try{
        const r = await fetch(getApiUrl('/api/notas')); if(!r.ok) throw new Error('bad');
        const notes = await r.json();
        if(JSON.stringify(notes)!==JSON.stringify(cachedNotes)){ cachedNotes = notes; render(); }
      }catch(e){ console.warn('fetchNotes failed', e); }
    }
    async function fetchPairing(){
      try{ const r = await fetch(getApiUrl('/api/pairing-code')); if(!r.ok) throw new Error('bad'); pairingCodeData = await r.json(); render(); }
      catch(e){ console.warn('fetchPairing failed', e); }
    }

    window.addEventListener('DOMContentLoaded', ()=>{
      if(window.initialPairing) pairingCodeData = window.initialPairing;
      if(window.initialNotes) cachedNotes = window.initialNotes;
      setLang(currentLang);
      fetchNotes(); fetchPairing();
      setInterval(()=>{ fetchNotes(); fetchPairing(); },2000);

      // Registrar Service Worker para soporte PWA (Instalar como App)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('Service Worker registrado con éxito.'))
          .catch(err => console.warn('Error al registrar Service Worker:', err));
      }
    });
  </script>
</body>
</html>
